<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Renato Silva Imóveis — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --color-primary: #d4af37;
  --color-primary-dark: #b8940d;
  --color-gray-50: #f5f5f5;
  --color-gray-100: #e8e8e8;
  --color-gray-200: #d0d0d0;
  --color-gray-700: #4a4a4a;
  --color-gray-900: #1a1a1a;
  --color-success: #10b981;
  --color-danger: #ef4444;
  --color-border: #3a3a3a;
  --color-bg-dark: #0d0d0d;
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'Inter', sans-serif;
}

html, body {
  background: var(--color-bg-dark);
  color: var(--color-gray-50);
  font-family: var(--font-sans);
  height: 100%;
}

/* LOGIN */
.login-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--color-bg-dark) 0%, #1a1a1a 100%);
  padding: 20px;
}

.login-box {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 1px solid var(--color-primary);
  border-radius: 8px;
  padding: 40px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 24px 64px rgba(212, 175, 55, 0.15);
}

.login-box h1 {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 8px;
  text-align: center;
}

.login-box p {
  font-size: 12px;
  color: var(--color-gray-200);
  text-align: center;
  margin-bottom: 32px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.form-group label {
  font-weight: 600;
  font-size: 13px;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input {
  padding: 12px 16px;
  border: 1px solid var(--color-primary);
  border-radius: 4px;
  font-size: 14px;
  background: rgba(26, 26, 26, 0.8);
  color: var(--color-gray-50);
}

.form-group input:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
}

.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--color-primary);
  color: var(--color-bg-dark);
  border: none;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.3s;
}

.btn-login:hover {
  background: var(--color-primary-dark);
  transform: translateY(-2px);
}

.error-msg {
  color: var(--color-danger);
  font-size: 13px;
  text-align: center;
  margin-bottom: 16px;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid var(--color-danger);
  border-radius: 4px;
  display: none;
}

/* DASHBOARD */
.dashboard {
  display: none;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--color-bg-dark) 0%, #1a1a1a 100%);
}

.dashboard.active {
  display: flex;
  flex-direction: column;
}

.dashboard-header {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border-bottom: 2px solid var(--color-primary);
  padding: 20px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dashboard-header h1 {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  color: var(--color-primary);
}

.btn-logout {
  padding: 8px 16px;
  background: var(--color-danger);
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
}

.btn-logout:hover {
  background: #dc2626;
}

.dashboard-content {
  flex: 1;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
  padding: 32px 24px;
}

.content-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.content-header h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-add-imovel {
  padding: 12px 24px;
  background: var(--color-primary);
  color: var(--color-bg-dark);
  border: none;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-add-imovel:hover {
  background: var(--color-primary-dark);
}

/* TABELA */
.table-container {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: rgba(212, 175, 55, 0.1);
  border-bottom: 1px solid var(--color-primary);
}

th {
  padding: 16px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

td {
  padding: 16px;
  border-bottom: 1px solid var(--color-border);
  font-size: 13px;
  color: var(--color-gray-200);
}

tbody tr:hover {
  background: rgba(212, 175, 55, 0.05);
}

.btn-edit, .btn-delete {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  margin-right: 8px;
  transition: all 0.2s;
}

.btn-edit {
  background: var(--color-primary);
  color: var(--color-bg-dark);
}

.btn-edit:hover {
  background: var(--color-primary-dark);
}

.btn-delete {
  background: var(--color-danger);
  color: white;
}

.btn-delete:hover {
  background: #dc2626;
}

/* MODAL FORM */
.modal-form {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(5px);
}

.modal-form.active {
  display: flex;
}

.modal-form-content {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 1px solid var(--color-primary);
  border-radius: 8px;
  padding: 32px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-form-content h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  color: var(--color-primary);
  margin-bottom: 24px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.form-row.full {
  grid-template-columns: 1fr;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group label {
  font-weight: 600;
  font-size: 12px;
  color: var(--color-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea,
.form-group select {
  padding: 12px 16px;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  font-size: 14px;
  background: rgba(26, 26, 26, 0.8);
  color: var(--color-gray-50);
  font-family: inherit;
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
}

.upload-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--color-border);
}

.upload-section h3 {
  color: var(--color-primary);
  font-size: 14px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.upload-input {
  padding: 12px 16px;
  border: 2px dashed var(--color-primary);
  border-radius: 4px;
  background: rgba(212, 175, 55, 0.05);
  cursor: pointer;
  text-align: center;
  margin-bottom: 12px;
}

.uploaded-items {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.uploaded-item {
  position: relative;
  background: var(--color-gray-700);
  border-radius: 4px;
  overflow: hidden;
  height: 100px;
}

.uploaded-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.uploaded-item .btn-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--color-danger);
  color: white;
  border: none;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  cursor: pointer;
  font-size: 14px;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn-save {
  flex: 1;
  padding: 12px;
  background: var(--color-primary);
  color: var(--color-bg-dark);
  border: none;
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-save:hover {
  background: var(--color-primary-dark);
}

.btn-cancel {
  flex: 1;
  padding: 12px;
  background: transparent;
  color: var(--color-primary);
  border: 1px solid var(--color-primary);
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-cancel:hover {
  background: rgba(212, 175, 55, 0.1);
}

.message {
  padding: 12px 16px;
  border-radius: 4px;
  margin-bottom: 16px;
  display: none;
  font-weight: 500;
}

.message.success {
  background: rgba(16, 185, 129, 0.1);
  color: #10b981;
  border: 1px solid #10b981;
}

.message.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--color-danger);
  border: 1px solid var(--color-danger);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--color-gray-200);
}

.empty-state h3 {
  color: var(--color-primary);
  margin-bottom: 12px;
}

@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  
  table {
    font-size: 12px;
  }
  
  th, td {
    padding: 12px 8px;
  }
}

</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-container" id="login-container">
  <div class="login-box">
    <h1>Renato Silva</h1>
    <p>Imóveis</p>
    <div class="error-msg" id="error-login"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Senha de Acesso</label>
        <input type="password" id="login-password" placeholder="Digite sua senha" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dashboard-header">
    <h1>Painel Administrativo</h1>
    <button class="btn-logout" id="btn-logout">Logout</button>
  </div>

  <div class="dashboard-content">
    <div class="content-header">
      <h2>Meus Imóveis</h2>
      <button class="btn-add-imovel" id="btn-add-imovel">+ Adicionar Imóvel</button>
    </div>

    <div class="message" id="message"></div>

    <div class="table-container">
      <table id="imoveis-table">
        <thead>
          <tr>
            <th>Localização</th>
            <th>Tipo</th>
            <th>Operação</th>
            <th>Preço</th>
            <th>Área</th>
            <th>Quartos</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display: none;">
        <h3>Nenhum imóvel cadastrado</h3>
        <p>Clique em "+ Adicionar Imóvel" para começar</p>
      </div>
    </div>
  </div>
</div>

<!-- MODAL FORM -->
<div class="modal-form" id="modal-form">
  <div class="modal-form-content">
    <h2 id="form-title">Novo Imóvel</h2>
    
    <div class="message" id="form-message"></div>

    <form id="imovel-form">
      <div class="form-row">
        <div class="form-group">
          <label>Tipo de Imóvel *</label>
          <select id="form-tipo" required>
            <option value="">Selecione</option>
            <option value="Apartamento">Apartamento</option>
            <option value="Casa">Casa</option>
            <option value="Sobrado">Sobrado</option>
            <option value="Comercial">Comercial</option>
            <option value="Sala">Sala</option>
            <option value="Loja">Loja</option>
            <option value="Terreno">Terreno</option>
          </select>
        </div>
        <div class="form-group">
          <label>Operação *</label>
          <select id="form-operacao" required>
            <option value="">Selecione</option>
            <option value="venda">Venda</option>
            <option value="locacao">Locação</option>
          </select>
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Endereço Completo *</label>
          <input type="text" id="form-endereco" placeholder="Ex: Avenida Recife, 1000" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Bairro *</label>
          <input type="text" id="form-bairro" placeholder="Ex: Boa Viagem" required>
        </div>
        <div class="form-group">
          <label>Cidade *</label>
          <input type="text" id="form-cidade" placeholder="Ex: Recife" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>CEP</label>
          <input type="text" id="form-cep" placeholder="51020-020">
        </div>
        <div class="form-group">
          <label>Preço *</label>
          <input type="number" id="form-preco" placeholder="Ex: 450000" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Área (m²) *</label>
          <input type="number" id="form-area" placeholder="Ex: 85" required>
        </div>
        <div class="form-group">
          <label>Quartos *</label>
          <input type="number" id="form-quartos" placeholder="Ex: 3" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Banheiros *</label>
          <input type="number" id="form-banheiros" placeholder="Ex: 2" required>
        </div>
        <div class="form-group">
          <label>Vagas de Garagem</label>
          <input type="text" id="form-vagas" placeholder="Ex: 2">
        </div>
      </div>

      <div class="form-row full">
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="form-descricao" placeholder="Descreva os diferenciais do imóvel..."></textarea>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Latitude (para mapa)</label>
          <input type="number" id="form-latitude" placeholder="Ex: -8.0896" step="0.0001">
        </div>
        <div class="form-group">
          <label>Longitude (para mapa)</label>
          <input type="number" id="form-longitude" placeholder="Ex: -34.9286" step="0.0001">
        </div>
      </div>

      <div class="upload-section">
        <h3>📸 Fotos (máximo 10)</h3>
        <input type="file" id="file-fotos" multiple accept="image/*" class="upload-input">
        <div class="uploaded-items" id="fotos-uploaded"></div>
        <input type="hidden" id="form-fotos" value="[]">
      </div>

      <div class="upload-section">
        <h3>🎥 Vídeos (máximo 2 — URLs)</h3>
        <div class="form-group">
          <label>URL do Vídeo 1</label>
          <input type="url" id="form-video1" placeholder="https://youtube.com/watch?v=... ou https://vimeo.com/...">
        </div>
        <div class="form-group">
          <label>URL do Vídeo 2</label>
          <input type="url" id="form-video2" placeholder="https://youtube.com/watch?v=... ou https://vimeo.com/...">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">Salvar Imóvel</button>
        <button type="button" class="btn-cancel" id="btn-cancel-form">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script>
// CONFIG
const SUPABASE_URL = 'https://ykcbjirgjyzrvbclkfov.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrY2JqaXJnanl6cnZiY2xrZm92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMTk0NjEsImV4cCI6MjEwMzc5NTQ2MX0.IRnMLjDZQ2M1TA3qs_Kytlkp1f72VGvrevRAWILozSU';
const ADMIN_PASSWORD = '@!BernardoSilva123';

let isLoggedIn = false;
let allImoveis = [];
let editingId = null;

// DOM
const loginContainer = document.getElementById('login-container');
const dashboard = document.getElementById('dashboard');
const loginForm = document.getElementById('login-form');
const loginPassword = document.getElementById('login-password');
const errorLogin = document.getElementById('error-login');
const btnLogout = document.getElementById('btn-logout');
const btnAddImovel = document.getElementById('btn-add-imovel');
const modalForm = document.getElementById('modal-form');
const btnCancelForm = document.getElementById('btn-cancel-form');
const imovelForm = document.getElementById('imovel-form');
const tableBody = document.getElementById('table-body');
const emptyState = document.getElementById('empty-state');
const filefotos = document.getElementById('file-fotos');
const formFotos = document.getElementById('form-fotos');
const fotosUploaded = document.getElementById('fotos-uploaded');
const message = document.getElementById('message');
const formMessage = document.getElementById('form-message');

// EVENTOS
loginForm.addEventListener('submit', handleLogin);
btnLogout.addEventListener('click', handleLogout);
btnAddImovel.addEventListener('click', openNewForm);
btnCancelForm.addEventListener('click', closeForm);
imovelForm.addEventListener('submit', handleSaveImovel);
filefotos.addEventListener('change', handlePhotoUpload);

// LOGIN
function handleLogin(e) {
  e.preventDefault();
  const password = loginPassword.value;

  if (password === ADMIN_PASSWORD) {
    isLoggedIn = true;
    errorLogin.style.display = 'none';
    loginContainer.style.display = 'none';
    dashboard.classList.add('active');
    loadImoveis();
  } else {
    errorLogin.textContent = 'Senha incorreta';
    errorLogin.style.display = 'block';
    loginPassword.value = '';
  }
}

function handleLogout() {
  isLoggedIn = false;
  loginContainer.style.display = 'flex';
  dashboard.classList.remove('active');
  loginPassword.value = '';
  editingId = null;
}

// CRUD
async function loadImoveis() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/imoveis?select=*`, {
      headers: { apikey: SUPABASE_KEY }
    });
    allImoveis = await res.json();
    renderTable();
  } catch (err) {
    showMessage('Erro ao carregar imóveis', 'error');
  }
}

function renderTable() {
  tableBody.innerHTML = '';

  if (allImoveis.length === 0) {
    emptyState.style.display = 'block';
    return;
  }

  emptyState.style.display = 'none';

  allImoveis.forEach(imovel => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${imovel.bairro}</td>
      <td>${imovel.tipo}</td>
      <td>${imovel.tipo_operacao === 'venda' ? 'Venda' : 'Locação'}</td>
      <td>R$ ${imovel.preco.toLocaleString('pt-BR')}</td>
      <td>${imovel.area}m²</td>
      <td>${imovel.quartos}</td>
      <td>
        <button class="btn-edit" onclick="editImovel('${imovel.id}')">Editar</button>
        <button class="btn-delete" onclick="deleteImovel('${imovel.id}')">Deletar</button>
      </td>
    `;
    tableBody.appendChild(row);
  });
}

function openNewForm() {
  editingId = null;
  document.getElementById('form-title').textContent = 'Novo Imóvel';
  imovelForm.reset();
  fotosUploaded.innerHTML = '';
  formFotos.value = '[]';
  modalForm.classList.add('active');
}

function editImovel(id) {
  const imovel = allImoveis.find(i => i.id === id);
  if (!imovel) return;

  editingId = id;
  document.getElementById('form-title').textContent = 'Editar Imóvel';

  document.getElementById('form-tipo').value = imovel.tipo;
  document.getElementById('form-operacao').value = imovel.tipo_operacao;
  document.getElementById('form-endereco').value = imovel.endereco;
  document.getElementById('form-bairro').value = imovel.bairro;
  document.getElementById('form-cidade').value = imovel.cidade;
  document.getElementById('form-cep').value = imovel.cep || '';
  document.getElementById('form-preco').value = imovel.preco;
  document.getElementById('form-area').value = imovel.area;
  document.getElementById('form-quartos').value = imovel.quartos;
  document.getElementById('form-banheiros').value = imovel.banheiros;
  document.getElementById('form-vagas').value = imovel.vagas || '';
  document.getElementById('form-descricao').value = imovel.descricao || '';
  document.getElementById('form-latitude').value = imovel.latitude || '';
  document.getElementById('form-longitude').value = imovel.longitude || '';
  document.getElementById('form-video1').value = (imovel.videos && imovel.videos[0]) || '';
  document.getElementById('form-video2').value = (imovel.videos && imovel.videos[1]) || '';

  renderFotos(imovel.fotos || []);
  modalForm.classList.add('active');
}

function handlePhotoUpload(e) {
  const files = Array.from(e.target.files);
  const currentFotos = JSON.parse(formFotos.value);

  if (currentFotos.length + files.length > 10) {
    showFormMessage('Máximo 10 fotos permitidas', 'error');
    return;
  }

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const base64 = event.target.result;
      currentFotos.push(base64);
      formFotos.value = JSON.stringify(currentFotos);
      renderFotos(currentFotos);
    };
    reader.readAsDataURL(file);
  });
}

function renderFotos(fotos) {
  fotosUploaded.innerHTML = '';
  fotos.forEach((foto, idx) => {
    const div = document.createElement('div');
    div.className = 'uploaded-item';
    div.innerHTML = `
      <img src="${foto}" alt="Foto ${idx + 1}">
      <button type="button" class="btn-remove" onclick="removeFoto(${idx})">✕</button>
    `;
    fotosUploaded.appendChild(div);
  });
}

function removeFoto(idx) {
  const fotos = JSON.parse(formFotos.value);
  fotos.splice(idx, 1);
  formFotos.value = JSON.stringify(fotos);
  renderFotos(fotos);
}

async function handleSaveImovel(e) {
  e.preventDefault();

  const data = {
    tipo: document.getElementById('form-tipo').value,
    tipo_operacao: document.getElementById('form-operacao').value,
    endereco: document.getElementById('form-endereco').value,
    bairro: document.getElementById('form-bairro').value,
    cidade: document.getElementById('form-cidade').value,
    cep: document.getElementById('form-cep').value,
    preco: parseFloat(document.getElementById('form-preco').value),
    area: parseFloat(document.getElementById('form-area').value),
    quartos: parseInt(document.getElementById('form-quartos').value),
    banheiros: parseInt(document.getElementById('form-banheiros').value),
    vagas: document.getElementById('form-vagas').value,
    descricao: document.getElementById('form-descricao').value,
    fotos: JSON.parse(formFotos.value),
    videos: [document.getElementById('form-video1').value, document.getElementById('form-video2').value].filter(v => v),
    latitude: parseFloat(document.getElementById('form-latitude').value) || null,
    longitude: parseFloat(document.getElementById('form-longitude').value) || null
  };

  try {
    if (editingId) {
      // ATUALIZAR
      const res = await fetch(`${SUPABASE_URL}/rest/v1/imoveis?id=eq.${editingId}`, {
        method: 'PATCH',
        headers: {
          apikey: SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('Erro ao atualizar');
      showFormMessage('✓ Imóvel atualizado com sucesso!', 'success');
    } else {
      // CRIAR
      const res = await fetch(`${SUPABASE_URL}/rest/v1/imoveis`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('Erro ao criar');
      showFormMessage('✓ Imóvel criado com sucesso!', 'success');
    }

    setTimeout(() => {
      closeForm();
      loadImoveis();
    }, 1500);
  } catch (err) {
    showFormMessage('Erro ao salvar imóvel', 'error');
  }
}

async function deleteImovel(id) {
  if (!confirm('Tem certeza que deseja deletar este imóvel?')) return;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/imoveis?id=eq.${id}`, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_KEY }
    });
    if (!res.ok) throw new Error('Erro ao deletar');
    showMessage('✓ Imóvel deletado com sucesso!', 'success');
    loadImoveis();
  } catch (err) {
    showMessage('Erro ao deletar imóvel', 'error');
  }
}

function closeForm() {
  modalForm.classList.remove('active');
  editingId = null;
}

function showMessage(text, type) {
  message.textContent = text;
  message.className = `message ${type}`;
  message.style.display = 'block';
  setTimeout(() => message.style.display = 'none', 4000);
}

function showFormMessage(text, type) {
  formMessage.textContent = text;
  formMessage.className = `message ${type}`;
  formMessage.style.display = 'block';
  setTimeout(() => formMessage.style.display = 'none', 4000);
}

</script>
</body>
</html>
